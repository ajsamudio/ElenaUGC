# Refreshes lib/live-stats.json and the /shop page (lib/shop.json + its images)
# every 4 hours and commits them if anything changed. The commit triggers a normal
# Vercel deploy, so the site's numbers and shop stay fresh.
name: Refresh live stats + shop

on:
  schedule:
    # Every 4 hours: the public list only shows her 10 newest posts and she
    # posts ~15 a day, so a once-a-day run would miss some.
    - cron: "0 */4 * * *"
  workflow_dispatch: # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Shrinks the shop's poster images before they're committed.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # The scripts have no dependencies, so no npm install needed.
      - run: node scripts/fetch-stats.mjs
      - run: node scripts/fetch-shop.mjs

      - name: Commit if changed
        run: |
          git add lib/live-stats.json lib/shop.json public/images/shop
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live stats + shop"
          git push
